name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (full suite, includes 100k-op property tests + fuzz smoke)
        run: go test ./... -v -timeout 5m

      - name: fuzz smoke (30s — catches regressions the seed corpus doesn't)
        run: go test ./internal/book/ -fuzz FuzzBook -fuzztime 30s

      # The default `go test ./...` above VERIFIES that README.md's Results
      # section matches the committed results/*.json. It does not regenerate
      # them: regeneration is opt-in (BOURSE_REGEN=1), because a suite that
      # rewrites its own expected values fails every second run.
      - name: benchmark + regenerate reports
        run: BOURSE_REGEN=1 go test ./bench/... -run Report -bench . -benchmem -timeout 10m

      - name: upload measured reports
        uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: |
            results/latency.json
            results/throughput.json
            results/latency_stability.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image and run test suite inside it
        run: docker build -t bourse:ci . && docker run --rm bourse:ci
