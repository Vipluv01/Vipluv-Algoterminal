<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VS Algoterminal</title>
<style>
  /* Inline, not theme.css -- this has to render from the raw HTML alone,
     before the stylesheet link (let alone React) has necessarily
     finished loading, so the very first paint is never a blank page.
     Static colors, not var(--bg)/var(--text): those tokens are defined
     in theme.css, whose own load is exactly what this is covering for.
     React's createRoot(...).render() replaces #root's entire contents
     on mount, so this needs no JS to be removed -- it just stops being
     rendered once real content replaces it. */
  #boot-loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #06080d; color: #8892a6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #boot-loading .boot-mark {
    width: 34px; height: 34px; border-radius: 8px; background: #2dd4bf;
    color: #06080d; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    animation: boot-pulse 1.4s ease-in-out infinite;
  }
  #boot-loading .boot-text { font-size: 13px; letter-spacing: 0.02em; }
  @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2306080d%22/><path d=%22M20 65 L38 40 L55 55 L80 25%22 stroke=%22%232dd4bf%22 stroke-width=%229%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<!-- IBM Plex Sans (UI text) + IBM Plex Mono (every numeral -- prices, qty,
     P&L, timestamps, %, IDs -- see theme.css's .mono / --font-mono and
     format.js). Self-hosted under ./fonts/ (see the @font-face block at
     the top of theme.css for why this isn't a Google Fonts CDN link).
     Only the two weights needed for first paint -- Sans 400 (body text)
     and Mono 400 (the flood of numerals visible before any interaction)
     -- are preloaded; Sans 500/600 and Mono 500 load on demand via the
     @font-face declarations, same as any other webfont. -->
<link rel="preload" href="./fonts/IBMPlexSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./src/theme.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "htm/react": "https://esm.sh/htm@3.1.1/react?external=react",
    "klinecharts": "https://esm.sh/klinecharts@9.8.9",
    "marked": "https://esm.sh/marked@12"
  }
}
</script>
</head>
<body>
<div id="root"><div id="boot-loading"><span class="boot-mark">A</span><span class="boot-text">Loading VS Algoterminal…</span></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
