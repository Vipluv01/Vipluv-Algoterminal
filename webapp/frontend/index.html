<!-- IBM Plex Sans (UI text) + IBM Plex Mono (every numeral -- prices, qty,
     P&L, timestamps, %, IDs -- see theme.css's .mono / --font-mono and
     format.js). Self-hosted under ./fonts/ (see the @font-face block at
     the top of theme.css for why this isn't a Google Fonts CDN link).
     Only the two weights needed for first paint -- Sans 400 (body text)
     and Mono 400 (the flood of numerals visible before any interaction)
     -- are preloaded; Sans 500/600 and Mono 500 load on demand via the
     @font-face declarations, same as any other webfont. -->
<link rel="preload" href="./fonts/IBMPlexSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin>
