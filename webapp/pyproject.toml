[project]
name = "bourse-webapp"
version = "0.1.0"
description = "algoterminal -- multi-strategy paper/live trading platform, backed by bourse's Go matching engine for paper mode."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "authlib",
    "httpx",
    "python-dotenv",
    "itsdangerous",
    "cryptography",
    "numpy",
    "scipy",
    "statsmodels",
    # pandas is imported directly by app/strategies/pairs_cointegration.py.
    # It was previously present only transitively (via statsmodels), which
    # means a statsmodels release that drops the dependency would break the
    # pairs strategy with no change on our side.
    "pandas",
    "alembic",
    "nh3>=0.3.7",
    # Phase 7 (Angel One SmartAPI live broker integration, app/broker/).
    "smartapi-python",
    "pyotp",  # TOTP code generation from the stored base32 seed -- see app/broker/angelone.py
    # smartapi-python's own PyPI metadata (Requires-Dist) omits these two,
    # but its source unconditionally imports both (SmartApi/smartConnect.py
    # and smartWebSocketV2.py) -- confirmed by inspecting the actual wheel,
    # not assumed. Without them listed here explicitly, `import SmartApi`
    # raises ImportError on a clean install despite smartapi-python itself
    # being present.
    "websocket-client",
    "logzero",
    # Render deploy: DATABASE_URL can point at Postgres instead of the
    # sqlite default (see app/db.py's own docstring). psycopg v3, not
    # psycopg2-binary -- actively maintained, and its binary wheel needs
    # no system libpq. app/db.py normalizes both "postgres://" and bare
    # "postgresql://" to "postgresql+psycopg://" so this is the dialect
    # that actually gets used regardless of which scheme DATABASE_URL
    # arrives with.
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # Frontend e2e verification only (tests/e2e/) -- drives the already-
    # running dev server with a real headless Chromium via Playwright's
    # Python API, never Node. Not a runtime dependency: nothing under
    # app/ imports these.
    "playwright",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
